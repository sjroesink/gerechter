name: Deploy Gerechter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gerechter-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy gerechter.roesink.dev
    if: github.repository == 'sjroesink/gerechter'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gerechter
          POSTGRES_PASSWORD: gerechter
          POSTGRES_DB: gerechter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gerechter -d gerechter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@10.32.1
          pnpm install --frozen-lockfile
      - name: Validate and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: Production browser regression with isolated database and AH transport fixture
        env:
          E2E_ADMIN_DATABASE_URL: postgres://gerechter:gerechter@localhost:5432/gerechter
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gerechter-uv"
          "$RUNNER_TEMP/gerechter-uv/bin/pip" install uv==0.12.3
          export PATH="$RUNNER_TEMP/gerechter-uv/bin:$PATH"
          uv sync --frozen --project sidecar
          pnpm exec playwright install --with-deps chromium
          # Playwright owns the production server and the isolated ASGI/mock-AH service.
          # Do not set E2E_BASE_URL: external mode deliberately skips AH transport tests.
          pnpm test:e2e
      - name: Production browser regression without AH configuration
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_DATABASE_URL: postgres://gerechter:gerechter@localhost:5432/gerechter_e2e
          E2E_AH_DISABLED: '1'
          DATABASE_URL: postgres://gerechter:gerechter@localhost:5432/gerechter_e2e
          PUBLIC_BASE_URL: http://localhost:3100
          BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-0000
          ADMIN_EMAIL: beheer@e2e.test
          PORT: '3100'
        run: |
          set -euo pipefail
          node scripts/start.mjs > "$RUNNER_TEMP/gerechter-e2e-no-ah-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3100/health >/dev/null; then ready=true; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = true
          pnpm exec playwright test 15-pantry-ah -g niet-ingeschakelde
      - name: Verify production Docker build
        run: docker build --tag gerechter:ci .
      - name: Trigger authenticated Unraid deployment
        if: vars.GERECHTER_DEPLOY_ENABLED == 'true'
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            token="$(curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deploy.roes.ink" | jq -r .value)"
            test -n "$token"
            response_file="$(mktemp)"
            http_code="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Token: ${REPOSITORY_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"stack":"gerechter"}' --output "$response_file" \
              --write-out '%{http_code}' https://deploy.roes.ink/hooks/deploy || true)"
            response="$(<"$response_file")"
            rm -f "$response_file"
            if [ "$http_code" = 200 ]; then
              printf '%s\n' "$response"
              if printf '%s\n' "$response" | grep -Fq "Commit: ${GITHUB_SHA}" && \
                 printf '%s\n' "$response" | grep -Fq 'Deploy voltooid: gerechter'; then exit 0; fi
              if printf '%s\n' "$response" | grep -Fq "Deploy overgeslagen: gerechter ${GITHUB_SHA} vervangen door"; then exit 0; fi
              echo 'Onverwacht antwoord van deploywebhook.' >&2
              exit 1
            fi
            echo "Deploywebhook bezet of time-out (HTTP ${http_code}, poging ${attempt}/120)."
            sleep 10
          done
          echo 'Deploywebhook bleef twintig minuten onbereikbaar.' >&2
          exit 1
