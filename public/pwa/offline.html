<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c23b22" />
    <title>Offline · Gerechter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        color: #18201b;
        background: #f3f5f1;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
      }
      h1 {
        font-size: 1.8rem;
        letter-spacing: -0.04em;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 20px;
        border-radius: 12px;
        color: white;
        background: #9e2e19;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #f4efe9;
          background: #141211;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" width="80" height="80" />
      <p>Gerechter</p>
      <h1>Je bent offline</h1>
      <p>
        Gerechten, voorraad en je weekplanning zijn niet offline beschikbaar. Je privégegevens worden niet op
        dit apparaat bewaard voor offline gebruik.
      </p>
      <p>Maak verbinding met internet en open Gerechter opnieuw.</p>
      <a href="/">Opnieuw proberen</a>
    </main>
  </body>
</html>
