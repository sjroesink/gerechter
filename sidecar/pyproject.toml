[project]
name = "gerechter-ah-sidecar"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["python-appie==0.2.2", "fastapi", "uvicorn", "cryptography"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
